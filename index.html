document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', function(e) {
    if (e.keyCode === 123 || 
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
        (e.ctrlKey && e.keyCode === 85) || 
        (e.ctrlKey && e.keyCode === 83)) {
        e.preventDefault();
        return false;
    }
});

// 2. ৩-ডট মেনু দিয়ে Inspect খুললে স্ক্রিন খালি ও লুপ তৈরি করার ট্রিক

// (ক) উইন্ডো সাইজ ডিটেক্টর (পাশে বা নিচে Inspect খুললেই স্ক্রিন খালি হয়ে যাবে)
setInterval(function() {
    const widthThreshold = window.outerWidth - window.innerWidth > 160;
    const heightThreshold = window.outerHeight - window.innerHeight > 160;
    
    if (widthThreshold || heightThreshold) {
        document.body.innerHTML = '<div style="background:#111827; color:red; height:100vh; display:flex; align-items:center; justify-content:center; font-family:sans-serif;"><h1>Access Denied! Developer tools are disabled.</h1></div>';

}, 300);

const element = new Image();
Object.defineProperty(element, 'id', {
    get: function () {
        document.body.innerHTML = '<h1 style="color:red;text-align:center;">Access Denied!</h1>';

    }
});
setInterval(function() {
    console.log('%c', element);
    console.clear();

// (গ) ইনফিনিট ডাইনামিক ডিবাগার (ব্রাউজার ট্যাব হ্যাঙ্গ করে দেবে)
(function() {
    function block() {
        setInterval(function() {
            (function() {
                return false;
            })['constructor']('debugger')['call']('action');
        }, 50);
    }
    try { block(); } catch (e) {}
})();

}, 100);

function splitGraphemes(str) {
    if (!str) return [];
    const normalized = str.normalize("NFC").replace(/[\u200B-\u200D\uFEFF]/g, "");
    return Array.from(new Intl.Segmenter('bn', { granularity: 'grapheme' }).segment(normalized), s => s.segment);
}

function updateCategoryCounters() {
    let allResults = JSON.parse(localStorage.getItem("bijoy_lesson_results") || "{}");

    document.querySelectorAll('[id^="items-"]').forEach((group) => {
        let btns = group.querySelectorAll('.lesson-tracker-btn');
        let total = btns.length;
        let completed = 0;

       btns.forEach((btn) => {
            // একদম ১০০% নিখুঁতভাবে নাম খোঁজার জন্য data-title ব্যবহার করা হলো
            let lessonTitle = btn.getAttribute("data-title");
            
            if (lessonTitle) {
                let st = allResults[lessonTitle];
                // অ্যাকুরেসি ৯৮ বা তার বেশি হলে কমপ্লিট কাউন্ট বাড়বে
                if (st && parseInt(st.acc) >= 95) {
                    completed++;
                }
            }
        });

        let header = group.previousElementSibling;
        if (header) {
            let counterSpan = header.querySelector('.lesson-counter');
            
            if (!counterSpan) {
                counterSpan = document.createElement('span');
                counterSpan.className = 'lesson-counter';
                counterSpan.style.fontSize = '14px';
                // ৯৮% হলে সবুজ, না হলে ডিফল্ট নীল দেখাবে
                counterSpan.style.color = completed === total ? '#10b981' : '#60a5fa'; 
                counterSpan.style.marginRight = '10px';
                counterSpan.style.fontWeight = 'bold';
                counterSpan.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
                counterSpan.style.padding = '2px 8px';
                counterSpan.style.borderRadius = '6px';
                
                let iconSpan = header.querySelector("span[id^='icon-']");
                // এখানে parentElement যোগ করা হয়েছে যাতে সঠিক জায়গায় বসে
                if (iconSpan && iconSpan.parentElement) {
                    iconSpan.parentElement.insertBefore(counterSpan, iconSpan);
                }
            }
            
            // কালার ডাইনামিক আপডেট
            counterSpan.style.color = completed === total ? '#10b981' : '#60a5fa';
            counterSpan.innerText = `${completed}/${total}`;
        }
    });
}




function buildKeyboard(){
  let keyboard = document.getElementById("keyboard");

  if(!keyboard) return; // safety

  keyboard.innerHTML = "";

  KEYBOARD_ROWS.forEach(row => {
    let rowDiv = document.createElement("div");
    rowDiv.className = "row";

    row.forEach(key => {
      let keyDiv = document.createElement("div");
      keyDiv.className = "key";
      let display = key;

      // show bijoy character if available
      let normal = BIJOY_MAP[key] || "";
      let shift = BIJOY_SHIFT_MAP[key] || "";
      let en = key;

      // special keys
      if(["Backspace","Enter","Shift","Tab","Caps","Ctrl","Alt","Space","FN","Menu","window"].includes(key)){
        keyDiv.innerHTML = `<div class="key-label">${key.toUpperCase()}</div>`;
      } else {
        keyDiv.innerHTML = `
  <div class="shift">${shift}</div>
  <div class="main">${normal}</div>
  <div class="en">${en.toUpperCase()}</div>
`;
      }


      if(key === "Backspace" || key === "Enter") keyDiv.classList.add("xwide");
      else if(key === "Shift" || key === "Tab" || key === "Caps") keyDiv.classList.add("wide");
      else if(key === "Space") keyDiv.classList.add("space");

      keyDiv.id = "key-" + key.toLowerCase();

      rowDiv.appendChild(keyDiv);
    });

    keyboard.appendChild(rowDiv);
  });
}

document.getElementById("inputBox").addEventListener("keydown", function(e){

    // এর ফলে বিজয়ের পাঠানো অটোমেটিক/হিডেন ব্যাকস্পেস ইগনোর হবে।
    if (e.key === "Backspace" && e.code === "Backspace" && this.value.length > 0) {

// --------- typing (inputBox ইভেন্ট লিসেনার )  ---------------------
document.getElementById("inputBox").addEventListener("input", function(e){
  if(testEnded) return;

  let input = this.value;
try { if (val.normalize) { val = val.normalize("NFC"); } } catch (e) { console.log("Normalization not supported");
    }


// ব্যাকস্পেস দিলে নতুন করে ভুল ধরব না
    if (e.inputType === 'deleteContentBackward') {
	render(input);
        return;
    }


    let inputArr = splitGraphemes(input);
    let targetArr = splitGraphemes(target);

  // যদি ইনপুট করা বর্ণের সংখ্যা টার্গেটের চেয়ে বেশি হয়, তবেই আটকাবে
    if(inputArr.length > targetArr.length) {
        this.value = inputArr.slice(0, targetArr.length).join('');
        return;
    }


// --- পারমানেন্ট ভুল ট্র্যাক করার লজিক ---
    let currentIndex = inputArr.length - 1; 
    if (currentIndex >= 0 && currentIndex < targetArr.length) {
        let typedChar = inputArr[currentIndex] || "";
        let targetChar = targetArr[currentIndex] || "";
        let cleanTyped = typedChar.replace(/[\u25CC\u200B-\u200D\uFEFF]/g, "");

        let isMistake = true;

        // ১. কারেন্ট অক্ষরের ভুল চেক
        if (cleanTyped !== "" && (targetChar === cleanTyped || targetChar.startsWith(cleanTyped))) {
            isMistake = false; 
        } 
        // ২. 'g', হসন্ত বা যেকোনো কার চাপলে কোনোভাবেই ভুল ধরবে না (আগের সেই ম্যাজিক লজিক)
        else if (['g','্'].includes(cleanTyped) || cleanTyped.includes('্')) {
            isMistake = false;
        }

       if (isMistake && cleanTyped !== "") {
            permanentMistakeCount++; 
        }

        // ৩. অসম্পূর্ণ যুক্তবর্ণের ভুল ধরার লজিক (তবে 'g' বা কার চাপলে স্কিপ করবে)
        if (currentIndex > 0) {
            let prevTyped = (inputArr[currentIndex - 1] || "").replace(/[\u25CC\u200B-\u200D\uFEFF]/g, "");
            let prevTarget = targetArr[currentIndex - 1] || "";
            
            // বর্তমান অক্ষরটা কি যুক্তবর্ণ বানানোর কোনো পার্ট? 
            let isBuildingNextPart = ['g', '্' ].includes(cleanTyped) || cleanTyped.includes('্');

            // যদি তুমি যুক্তবর্ণ না বানিয়ে অন্য কোনো অক্ষর বা স্পেস চাপো, তখনই শুধু আগেরটাকে ভুল ধরবে!
            if (!isBuildingNextPart && prevTyped !== "" && prevTarget !== prevTyped && prevTarget.startsWith(prevTyped)) {
                permanentMistakeCount++;
            }
        }
    }



  // এটি inputBox ইভেন্টের ভেতরে থাকবে
if (!startTime && input.length > 0) { 
    startTime = Date.now(); 
    timer = setInterval(updateTime, 1000); 
   }

  render(this.value);



// ৩. টাইপিং শেষ হলে সাথে সাথে রেজাল্ট দেখানো (সময় শেষ হওয়ার আগেই)
if (targetArr.length > 0 && inputArr.length >= targetArr.length) {
            testEnded = true;
            clearInterval(timer);
           setTimeout(showResult, 500); // কাস্টম মোডাল দেখাবে    
}
});

// মডাল বন্ধ করার এবং পরের লেসনে যাওয়ার ফাংশন
function closeModal() {
    document.getElementById("resultModal").style.display = "none";
 
     document.getElementById("wordCount").innerText = "0";	   // Word Count রিসেট করা হলো এখানে 

    saveSessionResult();
    showLastSession();

    // বর্তমান অ্যাকুরেসি চেক করা
    let currentAcc = parseInt(document.getElementById("accuracy").innerText);

    // প্রফেশনাল রুল: অ্যাকুরেসি ৯৫% এর নিচে হলে পরের লেসনে যাবে না
    if (currentAcc < 95) {
        start(); // বর্তমান লেসন আবার শুরু হবে
        setTimeout(() => document.getElementById("inputBox").focus(), 100);
        return; // কোড এখানেই থেমে যাবে, পরের লেসন খুঁজবে না
    }

    // অ্যাকুরেসি ৯৫% বা তার বেশি হলে পরের লেসন খুঁজে বের করা
    let btns = document.querySelectorAll('.lesson-tracker-btn');
    let nextLessonFound = false;
    
    for (let i = 0; i < btns.length; i++) {
        if (btns[i].style.fontWeight === "bold") {
            if (i + 1 < btns.length) {
                btns[i + 1].click(); 
                
                let parentGroup = btns[i + 1].parentElement;
                if (parentGroup && parentGroup.id.startsWith("items-")) {
                    parentGroup.style.display = "block";
                    let iconSpan = parentGroup.previousElementSibling.querySelector("span[id^='icon-']");
                    if (iconSpan) iconSpan.innerText = "▲";
                }
                
                nextLessonFound = true;
            }
            break;
        }
    }

    if (!nextLessonFound) {
        start();
    }
    
    setTimeout(() => document.getElementById("inputBox").focus(), 100);
}



// রেজাল্ট মডাল ওপেন থাকলে Enter চাপলেই 'প্র্যাকটিস চালিয়ে যান' ট্রিগার হবে
document.addEventListener("keydown", function(e) {
    let modal = document.getElementById("resultModal");
    if (modal && modal.style.display === "flex" && e.key === "Enter") {
        e.preventDefault();
        closeModal();
    }
});


// timer
function updateTime(){
    if(testEnded) return;

    if(totalTime > 0){
        remainingTime--;
        if(remainingTime <= 0){
            remainingTime = 0;
            testEnded = true;
            clearInterval(timer);
            document.getElementById("inputBox").disabled = true;
            showResult();
        }
    } else {
        // Stopwatch Mode: Jodi kono time select na kora hoy
        if (remainingTime === undefined || remainingTime === null) remainingTime = 0;
        remainingTime++; // Somoy 0 theke barbe
    }
    updateTimeDisplay();

}



// keyboard highlight

document.addEventListener("keyup", function(e){
  let code = e.code;
  let key = e.key.toLowerCase();

   if(code.startsWith("Key")) key = code.replace("Key","").toLowerCase();
  else if(code.startsWith("Digit")) key = code.replace("Digit","");
  else{
     const map = {
      Backquote: "`",
      Minus: "-",
      Equal: "=",
      BracketLeft: "[",
      BracketRight: "]",
      Backslash: "\\",
      Semicolon: ";",
      Quote: "'",
      Comma: ",",
      Period: ".",
      Slash: "/",

      Space: "space",
      Enter: "enter",
      Tab: "tab",
      Backspace: "backspace",

      ShiftLeft: "shift",
      ShiftRight: "shift",

      ControlLeft: "ctrl",
      ControlRight: "ctrl",

      AltLeft: "alt",
      AltRight: "alt"
    };

    key = map[code];
  }

  if(!key) return;

  let el = document.getElementById("key-" + key);
  if(el){
    el.classList.add("active");
    setTimeout(()=>el.classList.remove("active"),100);
  }

  if(code === "Tab"){
    e.preventDefault();
    start();
  }
});


function highlightNextKey(expectedChar) {
    // ১. আগের সব হাইলাইট মুছে ফেলা
    document.querySelectorAll('.key.next-guide, .key.shift-guide').forEach(el => {
        el.classList.remove('next-guide', 'shift-guide');
    });

    if (currentLessonTitle !== 'স্বরবর্ণ (Vowels)' && currentLessonTitle !== 'ব্যঞ্জনবর্ণ ও সংখ্যা' ) {
        return; 
    }

    if (!expectedChar) return;

    // ২. স্পেস এবং ব্রাউজারের অটো-জেনারেটেড ডটেড সার্কেল (◌) ক্লিন করা
    let cleanChar = expectedChar.replace(/[\s\u25CC\u200B-\u200D\uFEFF]/g, '');

    if (cleanChar === '') {
        document.getElementById('key-space')?.classList.add('next-guide');
        return;
    }

    let targetKey = null;
    let needsShift = false;

    // ৩. ইউজারের ইনপুট বক্সের বর্তমান অবস্থা চেক করা (g কি চাপা হয়েছে কিনা তা বোঝার জন্য)
    let typedText = document.getElementById("inputBox").value;
    let lastTypedChar = typedText.slice(-1);

   // ৪. স্বরবর্ণের ডাইনামিক লজিক (g চাপার আগে ও পরে)
    const vowelMap = {
        'আ': { k: 'f', shift: false },
        'ই': { k: 'd', shift: false },
        'ঈ': { k: 'd', shift: true },
        'উ': { k: 's', shift: false },
        'ঊ': { k: 's', shift: true },
        'ঋ': { k: 'a', shift: false },
        'এ': { k: 'c', shift: false },
        'ঐ': { k: 'c', shift: true },
        'ঔ': { k: 'x', shift: true }
    };

    if (vowelMap[cleanChar]) {
        if (lastTypedChar === '্') {
            // ইউজার অলরেডি 'g' (্) চেপেছে, তাই এখন কার-এর আসল বাটনটা দেখাবে
            targetKey = vowelMap[cleanChar].k;
            needsShift = vowelMap[cleanChar].shift;
        } else {
            // এখনো 'g' চাপেনি, তাই 'g' বাটন দেখাবে
            targetKey = 'g';
            needsShift = false;
        }
    } 
    else if (cleanChar === 'অ') {
        targetKey = 'f'; 
        needsShift = true;
    } 
    else if (cleanChar === 'ও') {
        targetKey = 'x'; 
        needsShift = false;
    } 
    else {
        // সাধারণ ম্যাপ চেক
        for (let k in BIJOY_MAP) {
            if (BIJOY_MAP[k] === cleanChar) { targetKey = k; break; }
        }
        if (!targetKey) {
            for (let k in BIJOY_SHIFT_MAP) {
                if (BIJOY_SHIFT_MAP[k] === cleanChar) { targetKey = k; needsShift = true; break; }
            }
        }
        
        // ৫. স্পেশাল ক্যারেক্টার ওভাররাইড
        if (cleanChar === 'ড়') { targetKey = 'p'; needsShift = false; }
        else if (cleanChar === 'ঢ়') { targetKey = 'p'; needsShift = true; }
        else if (cleanChar === 'য়') { targetKey = 'w'; needsShift = true; }
        else if (cleanChar === 'ৎ') { targetKey = '\\'; needsShift = false; }
        else if (cleanChar === 'ং') { targetKey = 'q'; needsShift = true; }
        else if (cleanChar === 'ঃ') { targetKey = '\\'; needsShift = true; }
        else if (cleanChar === 'ঁ') { targetKey = '7'; needsShift = true; } // Shift + 7
    }

    // ৬. কিবোর্ডে হাইলাইট করা
    if (targetKey) {
        let keyEl = document.getElementById('key-' + targetKey);
        if (keyEl) {
            keyEl.classList.add('next-guide');
            if (needsShift) {
                document.getElementById('key-shift')?.classList.add('shift-guide');
            }
        }
    }
}





// render + smooth scroll
function render(input) {
    let html = "";
    let correct = 0;
    let extra = 0;
    let missing = 0;

    let inputArr = splitGraphemes(input);
    let targetArr = splitGraphemes(target);

    const maxLength = Math.max(inputArr.length, targetArr.length);

    for (let i = 0; i < maxLength; i++) {
        let tChar = targetArr[i] || ""; 
        let iChar = inputArr[i] || ""; 
        
        if (i < targetArr.length) {
            if (i < inputArr.length) {
                if (iChar === tChar) {
                    html += `<span class="correct">${tChar}</span>`;
                    if (tChar !== " ") {
			correct++;
                } 
		}else {
                    html += `<span class="wrong">${tChar}</span>`;
                 } 
            } else if (i === inputArr.length) {
                html += `<span class="current">${tChar}</span>`;
            } else {
                html += tChar;
            }
        } else {
            if (i < inputArr.length) {
                extra++;
            }
        }
    }

    let totalMistakes = permanentMistakeCount + extra + missing;
	
    document.getElementById("textInner").innerHTML = html;
    document.getElementById("mistakeCount").innerText = totalMistakes;   // mistakes ভেরিয়েবলটি 
    mistakes = totalMistakes;
    document.getElementById("correctKeyCount").innerText = correct;   // correct ভেরিয়েবলটি 
    correctKeyCount = correct; // গ্লোবাল ভেরিয়েবলে সেভ রাখা

  // auto scroll
let current = document.querySelector(".current");
let container = document.querySelector(".text-display");

if(current){
  let currentRect = current.getBoundingClientRect();
  let containerRect = container.getBoundingClientRect();

  // if current line goes below visible area
  if(currentRect.bottom > containerRect.bottom - 20){
    let scrollAmount = currentRect.bottom - containerRect.bottom + 20;
    container.scrollTop += scrollAmount;
    container.scrollBy({ top: scrollAmount, behavior: "smooth" });
  }

// --- গাইড আপডেট ---
    if (!testEnded && targetArr.length > inputArr.length) {
        let nextChar = targetArr[inputArr.length];
        highlightNextKey(nextChar);
    } else {
        highlightNextKey(null); // শেষ হলে মুছে ফেলবে
    }
}    // <-- এটি তোমার render ফাংশনের শেষ ব্র্যাকেট

// --- রেজাল্ট আপডেট অংশ ---
    
    // ১. Accuracy আপডেট (correct ভেরিয়েবল ব্যবহার করে)
    let totalAttempts = correct + mistakes;
let accuracy = totalAttempts > 0 ? Math.round((correct / totalAttempts) * 100) : 100;
let accElement = document.getElementById("accuracy");
    accElement.innerText = accuracy;
    
    // ৯২% এর নিচে হলে লাল, না হলে সবুজ
    if (accuracy < 95) {
        accElement.style.color = "#ef4444"; // লাল
    } else {
        accElement.style.color = "#10b981"; // সবুজ
    }



// ২. WPM আপডেট (Net WPM প্রফেশনাল রুলস)
    let timeElapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
    let wpmValue = 0;
    
    if (timeElapsed > 0) {
        let minutes = timeElapsed / 60;
        let grossWPM = (inputArr.length / 5) / minutes; 

        // ঠিক না করা ভুলের হিসাব বের করা (লুপের বাইরে থেকে)
        let uncorrectedErrors = 0;
        for (let j = 0; j < inputArr.length; j++) {
            if (inputArr[j] !== targetArr[j]) {
                uncorrectedErrors++;
            }
        }

        // মোট স্পিড থেকে ভুলের পেনাল্টি বাদ দেওয়া
        let netWPM = grossWPM - (uncorrectedErrors / minutes);
        
        // স্পিড যেন মাইনাস (Negative) না হয়ে যায়, তাই Math.max(0) ব্যবহার করা হয়েছে
        wpmValue = Math.round(Math.max(0, netWPM)); 
    }
    
    document.getElementById("wpm").innerText = isFinite(wpmValue) ? wpmValue : 0;

    // ৩. Progress Bar আপডেট
    let progress = targetArr.length > 0 ? Math.min((inputArr.length / targetArr.length) * 100, 100) : 0;
    document.getElementById("progressBar").style.width = progress + "%";
}


// সেভ করা রেজাল্ট স্ক্রিনে দেখানোর আপডেট ফাংশন
function showLastSession() {
    const data = localStorage.getItem("bijoy_last_result");
    const lastSessionDiv = document.getElementById("lastSession");
    
    if (data && lastSessionDiv) {
        const last = JSON.parse(data);
        lastSessionDiv.style.display = "flex"; // লুক আপডেট: flex ব্যবহার করা হয়েছে
        
        // এনিমেশন সহ ভ্যালু সেট করা
        document.getElementById("lastWpm").innerText = last.wpm || 0;
        let lastAccEl = document.getElementById("lastAcc");    // মডালেও ৯২% এর নিচে লাল দেখাবে
        let accVal = parseInt(last.acc || 0);
        lastAccEl.innerText = accVal;
        if (accVal < 95) { lastAccEl.style.color = "#ef4444"; // লাল
        } else { lastAccEl.style.color = "#10b981"; }   // সবুজ
       
        document.getElementById("lastMistake").innerText = last.mistake || 0;
        document.getElementById("lastKeys").innerText = last.keys || 0;
	document.getElementById("lastTime").innerText = last.time || "00:00";
 } else if (lastSessionDiv) {
        lastSessionDiv.style.display = "none";
    }
}

// সেভ করার ফাংশনটিও আপডেট করা হলো যাতে সঠিক কী কাউন্ট ঠিক থাকে

        wpm: document.getElementById("wpm").innerText,
        acc: document.getElementById("accuracy").innerText,
        mistake: document.getElementById("mistakeCount").innerText,
        keys: correctKeyCount,
        time: document.getElementById("modalTime").innerText
 };
    localStorage.setItem("bijoy_last_result", JSON.stringify(result));

	// নির্দিষ্ট লেসনের রেজাল্ট সেভ করা
    if (currentLessonTitle) {
        let allResults = JSON.parse(localStorage.getItem("bijoy_lesson_results") || "{}");
        allResults[currentLessonTitle] = { wpm: result.wpm, acc: result.acc };

        let safeTitleId = currentLessonTitle.replace(/\s+/g, '');

                <span style="color:#818cf8;"> ${result.wpm} WPM</span> <br>
                <span style="color:${accColor};"> ${result.acc}% </span>
            </span>`;
        }
    }
updateCategoryCounters();

}
