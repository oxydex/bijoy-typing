<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bijoy Typing Practice Pro</title>
<link rel="stylesheet" href="style.css">

<!-- ১. Adsterra Push Notification Script এখানে পেস্ট করুন -->
<!-- <script ...></script> -->

<!-- ২. Adsterra Interstitial Script এখানে পেস্ট করুন -->
<!-- <script ...></script> -->

<style>
.sticky-ad-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: rgba(15, 23, 42, 0.95);
    border-top: 1px solid #334155;
    z-index: 999;
    text-align: center;
    padding: 5px 0;
}
</style>
</head>
<body style="padding-bottom: 90px;">

<div class="app-container" style="display: flex; gap: 20px; align-items: flex-start; max-width: 1300px; margin: auto; padding: 20px;">
    
    <!-- Sidebar -->
    <div class="sidebar" style="width: 300px; flex-shrink: 0;">
        <h3 style="color: #60a5fa; text-align: center; margin-top: 0;">Lessons</h3>
        <div id="lessonCards" style="display: flex; flex-direction: column; gap: 12px; max-height: 75vh; overflow-y: auto; padding-right: 10px; border-right: 1px solid #3a3f4b;"></div>

        <!-- Sidebar Banner Ad -->
        <div style="margin-top: 15px; text-align: center;">
            <!-- ৩. Adsterra Sidebar Banner Code -->
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" style="flex-grow: 1;">
        <h2 style="margin-top: 0; text-align: center;">Bijoy Typing Practice</h2>
        
        <!-- Native Ad Top -->
        <div style="text-align:center; margin-bottom:10px;">
            <!-- ৪. Adsterra Native Banner Code -->
        </div>

        <textarea id="target" placeholder="Paste or Select a Lesson..."></textarea>
        
        <!-- Stats & Controls -->
        <div id="lastSession">
            <div class="last-item" style="text-align: center;"><span class="last-label">Accuracy</span><span class="last-val last-acc"><span id="lastAcc">0</span>%</span></div>
            <div class="last-item" style="text-align: center;"><span class="last-label">Last Speed</span><span class="last-val last-wpm"><span id="lastWpm">0</span> WPM</span></div>
            <div class="last-item" style="text-align: center;"><span class="last-label">Mistakes</span><span class="last-val last-mistake" id="lastMistake">0</span></div>
            <div class="last-item" style="text-align: center;"><span class="last-label">Correct Keys</span><span class="last-val last-keys" id="lastKeys">0</span></div>
            <div class="last-item" style="text-align: center;"><span class="last-label">Time Taken</span><div class="last-val" style="color: #f59e0b;"><span id="lastTime">00:00</span></div></div>
        </div>

        <div class="control-grid">
            <div class="control-card time-setting">
                <span class="control-label">Time Selection</span>
                <div class="control-content">
                    <button onclick="setTime(120)">2m</button>
                    <button onclick="setTime(300)">5m</button>
                    <button onclick="setTime(600)">10m</button>
                    <div class="inline-input">
                        <input id="customTimeMin" type="number" placeholder="MM" style="width: 35px; text-align: center;"> :
                        <input id="customTimeSec" type="number" placeholder="SS" style="width: 35px; text-align: center;">
                        <button onclick="setCustomTime()" class="set-link">set</button>
                    </div>
                </div>
            </div>
            <div class="control-card action-setting">
                <span class="control-label">Test Controls</span>
                <div class="control-content">
                    <button class="action-btn start-btn" onclick="start()">START TEST</button>
                    <button class="action-btn restart-btn" onclick="restartTest()">RESET</button>
                </div>
            </div>
        </div>

        <div class="premium-stats-container">
            <div class="stat-item"><span class="stat-label">Accuracy</span><div class="stat-value"><span id="accuracy">100</span>%</div></div>
            <div class="stat-item"><span class="stat-label">Speed</span><div class="stat-value"><span id="wpm">0</span> WPM</div></div>
            <div class="stat-item"><span class="stat-label">Mistakes</span><div class="stat-value" id="mistakeCount">0</div></div>
            <div class="stat-item"><span class="stat-label">Correct Keys</span><div class="stat-value" id="correctKeyCount">0</div></div>
            <div class="stat-item"><span class="stat-label">Words</span><div class="stat-value" id="wordCount">0</div></div>
            <div class="stat-item"><span class="stat-label">Timer</span><div class="stat-value" id="time">00:00</div></div>
        </div>

        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
        <div class="text-display"><div id="textInner" class="text-inner"></div></div>
        <textarea id="inputBox" class="input" placeholder="Start typing..."></textarea>
        <div class="keyboard" id="keyboard"></div>

        <!-- Multiplex Ad (Below Keyboard) -->
        <div style="margin-top: 20px; text-align: center;">
            <!-- ৫. Adsterra Multiplex Ad Code -->
        </div>
    </div>
</div>

<!-- Sticky Footer Ad -->
<div class="sticky-ad-footer">
    <!-- ৬. Adsterra Sticky Footer Code -->
</div>

<!-- Modal -->
<div id="resultModal" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background:rgba(15, 23, 42, 0.9); backdrop-filter:blur(8px); align-items:center; justify-content:center;">
    <div style="background:#1e293b; padding:30px; border-radius:24px; text-align:center; max-width:400px; width:90%;">
        <h2 style="color:#f8fafc;">প্র্যাকটিস শেষ!</h2>
        <div id="motivationalMsg" style="display:none; padding: 10px; margin-bottom: 15px;"></div>
        <button onclick="closeModal()" style="background: #4f46e5; color: white; padding: 12px 25px; border-radius: 10px; cursor: pointer; width: 100%;">প্র্যাকটিস চালিয়ে যান</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
